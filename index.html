
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>For You</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
    }
    .module {
      width: 100%;
      min-height: 100vh;
    }
    iframe {
      display: block;
      width: 100%;
      height: 100vh;
      border: 0;
    }
    audio {
      position: fixed;
      bottom: 12px;
      right: 12px;
      width: 180px;
      z-index: 10;
    }
  </style>
</head>
<body>

  <audio controls loop>
    <source src="audio.mp3" type="audio/mpeg">
  </audio>

  <main id="modules"></main>

  <script>
    const files = [
      "module1.html",
      "module2(3).html",
      "module3(4).html",
      "module4(3).html",
      "module5(3).html",
      "module6(4).html",
      "module7.html"
    ];

    const container = document.getElementById("modules");

    files.forEach((file, i) => {
      const section = document.createElement("section");
      section.className = "module";
      section.id = "module" + (i + 1);

      const frame = document.createElement("iframe");
      frame.src = encodeURI(file);
      frame.title = "Module " + (i + 1);
      frame.loading = i === 0 ? "eager" : "lazy";

      section.appendChild(frame);
      container.appendChild(section);
    });
  </script>

</body>
</html>
